# nginx server block. Get the certificate first:  sudo certbot --nginx -d sentineltrade.axiominternational.ca
# The two limit_req zones go in the http {} block (for example /etc/nginx/conf.d/sentinel-limits.conf).
limit_req_zone $binary_remote_addr zone=sentinel_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sentinel_api:10m rate=300r/m;

server {
    listen 80;
    server_name sentineltrade.axiominternational.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sentineltrade.axiominternational.ca;

    ssl_certificate     /etc/letsencrypt/live/sentineltrade.axiominternational.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentineltrade.axiominternational.ca/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location = /api/auth/login {                     # extra brake on password guessing (Sentinel also locks after 5 failures)
        limit_req zone=sentinel_login burst=5 nodelay;
        include /etc/nginx/sentinel-proxy.conf;
    }
    location / {
        limit_req zone=sentinel_api burst=60 nodelay;
        include /etc/nginx/sentinel-proxy.conf;
    }
}

# /etc/nginx/sentinel-proxy.conf contains:
#   proxy_pass         http://127.0.0.1:8765;
#   proxy_http_version 1.1;
#   proxy_set_header   Host              $host;
#   proxy_set_header   X-Forwarded-For   $remote_addr;      # overwrite, never append: visitors cannot fake their address
#   proxy_set_header   X-Forwarded-Proto $scheme;
#   proxy_read_timeout 120s;
